name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile --store-dir .cache/pnpm-store --cache-dir .cache/pnpm-cache
      - run: pnpm --dir originals/drumRhythmGame install --frozen-lockfile
      - run: pnpm verify
